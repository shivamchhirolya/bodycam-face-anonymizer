<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 620" role="img" aria-label="Detailed pipeline architecture">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="7" refX="7" refY="3.5" orient="auto">
      <polygon points="0 0, 8 3.5, 0 7" fill="#1a2744"/>
    </marker>
    <marker id="arrg" markerWidth="8" markerHeight="7" refX="7" refY="3.5" orient="auto">
      <polygon points="0 0, 8 3.5, 0 7" fill="#2d6a4f"/>
    </marker>
    <linearGradient id="navy" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#243456"/>
      <stop offset="1" stop-color="#1a2744"/>
    </linearGradient>
  </defs>

  <rect width="920" height="620" fill="#f7f5ef"/>

  <!-- Lane 1 -->
  <rect x="8" y="8" width="904" height="118" rx="6" fill="#fff" stroke="#d8d2c4"/>
  <rect x="8" y="8" width="8" height="118" rx="0" fill="#1a2744"/>
  <text x="28" y="28" font-family="Outfit, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#1a2744" letter-spacing="1.4">JOBS  ù  IDEMPOTENCY</text>

  <rect x="28" y="44" width="130" height="62" rx="4" fill="url(#navy)"/>
  <text x="93" y="70" text-anchor="middle" font-family="Outfit, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#fff">Upload event</text>
  <text x="93" y="86" text-anchor="middle" font-family="Source Serif 4, Georgia, serif" font-size="9" fill="#e8c547">upload_id + file</text>

  <line x1="158" y1="75" x2="186" y2="75" stroke="#1a2744" stroke-width="1.4" marker-end="url(#arr)"/>

  <rect x="188" y="44" width="168" height="62" rx="4" fill="#fff" stroke="#1a2744" stroke-width="1.2"/>
  <text x="272" y="68" text-anchor="middle" font-family="Outfit, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#1a2744">Lock + fingerprint</text>
  <text x="272" y="84" text-anchor="middle" font-family="Source Serif 4, Georgia, serif" font-size="9" fill="#4a5560">size ù 1 MB head/mid/tail</text>

  <line x1="356" y1="75" x2="384" y2="75" stroke="#1a2744" stroke-width="1.4" marker-end="url(#arr)"/>

  <rect x="386" y="44" width="168" height="62" rx="4" fill="#fff" stroke="#1a2744" stroke-width="1.2"/>
  <text x="470" y="68" text-anchor="middle" font-family="Outfit, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#1a2744">SQLite job store</text>
  <text x="470" y="84" text-anchor="middle" font-family="Source Serif 4, Georgia, serif" font-size="9" fill="#4a5560">(upload_id, config_hash)</text>

  <line x1="554" y1="75" x2="582" y2="75" stroke="#1a2744" stroke-width="1.4" marker-end="url(#arr)"/>

  <rect x="584" y="44" width="150" height="62" rx="4" fill="#edf2f7" stroke="#1a2744"/>
  <text x="659" y="68" text-anchor="middle" font-family="Outfit, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#1a2744">Already done?</text>
  <text x="659" y="84" text-anchor="middle" font-family="Source Serif 4, Georgia, serif" font-size="9" fill="#4a5560">reuse output + QC</text>

  <line x1="734" y1="75" x2="762" y2="75" stroke="#1a2744" stroke-width="1.4" marker-end="url(#arr)"/>

  <rect x="764" y="44" width="128" height="62" rx="4" fill="#2d6a4f"/>
  <text x="828" y="70" text-anchor="middle" font-family="Outfit, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#fff">Return cached</text>
  <text x="828" y="86" text-anchor="middle" font-family="Source Serif 4, Georgia, serif" font-size="9" fill="#d8f3dc">else run live path</text>

  <!-- Lane 2 live -->
  <rect x="8" y="138" width="904" height="268" rx="6" fill="#fff" stroke="#d8d2c4"/>
  <rect x="8" y="138" width="8" height="268" fill="#0b4f8a"/>
  <text x="28" y="158" font-family="Outfit, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#0b4f8a" letter-spacing="1.4">LIVE PATH  ù  EVERY FRAME</text>

  <!-- row A -->
  <rect x="28" y="176" width="118" height="56" rx="4" fill="url(#navy)"/>
  <text x="87" y="200" text-anchor="middle" font-family="Outfit, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#fff">Decode</text>
  <text x="87" y="216" text-anchor="middle" font-family="Source Serif 4, Georgia, serif" font-size="9" fill="#e8c547">OpenCV + FPS</text>

  <line x1="146" y1="204" x2="168" y2="204" stroke="#1a2744" stroke-width="1.4" marker-end="url(#arr)"/>

  <rect x="170" y="176" width="118" height="56" rx="4" fill="#fff" stroke="#1a2744"/>
  <text x="229" y="200" text-anchor="middle" font-family="Outfit, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#1a2744">CLAHE?</text>
  <text x="229" y="216" text-anchor="middle" font-family="Source Serif 4, Georgia, serif" font-size="9" fill="#4a5560">only if too dark</text>

  <line x1="288" y1="204" x2="310" y2="204" stroke="#1a2744" stroke-width="1.4" marker-end="url(#arr)"/>

  <rect x="312" y="176" width="132" height="56" rx="4" fill="#fff" stroke="#1a2744"/>
  <text x="378" y="200" text-anchor="middle" font-family="Outfit, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#1a2744">Detect this frame?</text>
  <text x="378" y="216" text-anchor="middle" font-family="Source Serif 4, Georgia, serif" font-size="9" fill="#4a5560">skip if tracks are stable</text>

  <line x1="444" y1="204" x2="466" y2="204" stroke="#1a2744" stroke-width="1.4" marker-end="url(#arr)"/>

  <rect x="468" y="168" width="200" height="72" rx="4" fill="#0b4f8a"/>
  <text x="568" y="190" text-anchor="middle" font-family="Outfit, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#e8c547">YuNet 640  (default)</text>
  <text x="568" y="208" text-anchor="middle" font-family="Source Serif 4, Georgia, serif" font-size="9.5" fill="#fff">score e 0.18 ù OpenCV CPU</text>
  <text x="568" y="224" text-anchor="middle" font-family="Source Serif 4, Georgia, serif" font-size="9" fill="#c5d4e8">SCRFD-10G is a GPU swap</text>

  <line x1="668" y1="204" x2="690" y2="204" stroke="#1a2744" stroke-width="1.4" marker-end="url(#arr)"/>

  <rect x="692" y="176" width="198" height="56" rx="4" fill="#fff" stroke="#1a2744"/>
  <text x="791" y="200" text-anchor="middle" font-family="Outfit, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#1a2744">Keep if it looks like a face</text>
  <text x="791" y="216" text-anchor="middle" font-family="Source Serif 4, Georgia, serif" font-size="9" fill="#4a5560">landmarks or score e 0.75</text>

  <!-- dashed skip path -->
  <path d="M378 232 L378 258 L791 258 L791 232" fill="none" stroke="#8a8174" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="584" y="252" text-anchor="middle" font-family="Outfit, Helvetica, Arial, sans-serif" font-size="8.5" fill="#6b6458">coast on existing tracks when detect is skipped</text>

  <!-- row B -->
  <line x1="791" y1="232" x2="791" y2="286" stroke="#1a2744" stroke-width="1.4" marker-end="url(#arr)"/>

  <rect x="28" y="286" width="200" height="96" rx="4" fill="#fff" stroke="#0b4f8a" stroke-width="1.4"/>
  <text x="128" y="310" text-anchor="middle" font-family="Outfit, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#0b4f8a">Privacy ByteTrack</text>
  <text x="128" y="328" text-anchor="middle" font-family="Source Serif 4, Georgia, serif" font-size="9.5" fill="#4a5560">high 0.28 ù low 0.18</text>
  <text x="128" y="344" text-anchor="middle" font-family="Source Serif 4, Georgia, serif" font-size="9.5" fill="#4a5560">coast 14 frames</text>
  <text x="128" y="360" text-anchor="middle" font-family="Source Serif 4, Georgia, serif" font-size="9" fill="#6b6458">never drop a face for size</text>

  <line x1="228" y1="334" x2="256" y2="334" stroke="#1a2744" stroke-width="1.4" marker-end="url(#arr)"/>

  <rect x="258" y="286" width="200" height="96" rx="4" fill="#fff" stroke="#0b4f8a" stroke-width="1.4"/>
  <text x="358" y="310" text-anchor="middle" font-family="Outfit, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#0b4f8a">Adaptive pad</text>
  <text x="358" y="328" text-anchor="middle" font-family="Source Serif 4, Georgia, serif" font-size="9.5" fill="#4a5560">tiny ù pad ù 1.35</text>
  <text x="358" y="344" text-anchor="middle" font-family="Source Serif 4, Georgia, serif" font-size="9.5" fill="#4a5560">fill-frame ù pad 0.08</text>
  <text x="358" y="360" text-anchor="middle" font-family="Source Serif 4, Georgia, serif" font-size="9" fill="#6b6458">close-up stays usable</text>

  <line x1="458" y1="334" x2="486" y2="334" stroke="#1a2744" stroke-width="1.4" marker-end="url(#arr)"/>

  <rect x="488" y="286" width="200" height="96" rx="4" fill="#fff" stroke="#0b4f8a" stroke-width="1.4"/>
  <text x="588" y="310" text-anchor="middle" font-family="Outfit, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#0b4f8a">Hybrid ellipse blur</text>
  <text x="588" y="328" text-anchor="middle" font-family="Source Serif 4, Georgia, serif" font-size="9.5" fill="#4a5560">pixelate + Gaussian</text>
  <text x="588" y="344" text-anchor="middle" font-family="Source Serif 4, Georgia, serif" font-size="9.5" fill="#4a5560">soft edge, no box leak</text>
  <text x="588" y="360" text-anchor="middle" font-family="Source Serif 4, Georgia, serif" font-size="9" fill="#6b6458">hairline / jaw covered</text>

  <line x1="688" y1="334" x2="716" y2="334" stroke="#1a2744" stroke-width="1.4" marker-end="url(#arr)"/>

  <rect x="718" y="286" width="172" height="96" rx="4" fill="#1a2744"/>
  <text x="804" y="318" text-anchor="middle" font-family="Outfit, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#e8c547">NVENC encode</text>
  <text x="804" y="338" text-anchor="middle" font-family="Source Serif 4, Georgia, serif" font-size="9.5" fill="#fff">H.264 + copy audio</text>
  <text x="804" y="356" text-anchor="middle" font-family="Source Serif 4, Georgia, serif" font-size="9" fill="#c5d4e8">output.mp4</text>

  <!-- Lane 3 audit -->
  <rect x="8" y="418" width="904" height="194" rx="6" fill="#fff" stroke="#d8d2c4"/>
  <rect x="8" y="418" width="8" height="194" fill="#2d6a4f"/>
  <text x="28" y="438" font-family="Outfit, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#2d6a4f" letter-spacing="1.4">INDEPENDENT AUDIT  ù  RETINAFACE-R50</text>

  <rect x="28" y="456" width="150" height="64" rx="4" fill="#2d6a4f"/>
  <text x="103" y="480" text-anchor="middle" font-family="Outfit, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#fff">Sample frames</text>
  <text x="103" y="496" text-anchor="middle" font-family="Source Serif 4, Georgia, serif" font-size="9" fill="#d8f3dc">budget: 0.2 s GPU</text>

  <line x1="178" y1="488" x2="204" y2="488" stroke="#2d6a4f" stroke-width="1.4" marker-end="url(#arrg)"/>

  <rect x="206" y="456" width="168" height="64" rx="4" fill="#fff" stroke="#2d6a4f" stroke-width="1.3"/>
  <text x="290" y="480" text-anchor="middle" font-family="Outfit, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#2d6a4f">RetinaFace-R50</text>
  <text x="290" y="496" text-anchor="middle" font-family="Source Serif 4, Georgia, serif" font-size="9" fill="#4a5560">not used in the live path</text>

  <line x1="374" y1="488" x2="400" y2="488" stroke="#2d6a4f" stroke-width="1.4" marker-end="url(#arrg)"/>

  <rect x="402" y="456" width="196" height="64" rx="4" fill="#fff" stroke="#2d6a4f" stroke-width="1.3"/>
  <text x="500" y="480" text-anchor="middle" font-family="Outfit, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#2d6a4f">Residual visibility test</text>
  <text x="500" y="496" text-anchor="middle" font-family="Source Serif 4, Georgia, serif" font-size="9" fill="#4a5560">MAE e 9 and Laplacian e 22</text>

  <line x1="598" y1="488" x2="624" y2="488" stroke="#2d6a4f" stroke-width="1.4" marker-end="url(#arrg)"/>

  <rect x="626" y="456" width="128" height="64" rx="4" fill="#edf2f7" stroke="#2d6a4f"/>
  <text x="690" y="480" text-anchor="middle" font-family="Outfit, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#2d6a4f">Any leak?</text>
  <text x="690" y="496" text-anchor="middle" font-family="Source Serif 4, Georgia, serif" font-size="9" fill="#4a5560">count + crop hints</text>

  <line x1="754" y1="470" x2="784" y2="456" stroke="#2d6a4f" stroke-width="1.2" marker-end="url(#arrg)"/>
  <line x1="754" y1="506" x2="784" y2="520" stroke="#8a2a2a" stroke-width="1.2"/>
  <polygon points="784,516 792,520 784,524" fill="#8a2a2a"/>

  <rect x="794" y="440" width="98" height="40" rx="4" fill="#2d6a4f"/>
  <text x="843" y="465" text-anchor="middle" font-family="Outfit, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#fff">pass</text>

  <rect x="794" y="500" width="98" height="40" rx="4" fill="#8a2a2a"/>
  <text x="843" y="525" text-anchor="middle" font-family="Outfit, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#fff">needs_review</text>

  <text x="28" y="548" font-family="Source Serif 4, Georgia, serif" font-size="10.5" fill="#3a3e48">Sidecar JSON: frame count, detector, tracker, QC status, leak count, timings. Same upload + same config never runs twice.</text>
  <text x="28" y="568" font-family="Source Serif 4, Georgia, serif" font-size="10.5" fill="#3a3e48">A second pass can retry only the leaked frames. The auditor never writes the output video, so it cannot hide its own mistakes.</text>
  <text x="28" y="588" font-family="Outfit, Helvetica, Arial, sans-serif" font-size="9" fill="#6b6458">Default stack: YuNet + privacy ByteTrack + hybrid blur. GPU is reserved for RetinaFace QC (41ù vs CPU). Factory swap in factory.py.</text>
</svg>
